# infra/nginx/nginx.conf
#
# Reverse proxy + serveur du build frontend statique (voir le volume
# ./frontend/dist:/usr/share/nginx/html dans docker-compose.yml).
#
# HTTP (80)  : redirection vers HTTPS.
# HTTPS (443): terminaison TLS, sert le build React (SPA, fallback index.html)
#              et proxifie /api + /health vers le backend FastAPI (service
#              Docker "backend", port 8000 sur le réseau interne siem-net).

events {
    worker_connections 1024;
}

http {
    # Indispensable : sans ceci, nginx sert tous les fichiers statiques
    # (JS, CSS...) en "text/plain", ce que les navigateurs refusent
    # d'exécuter/appliquer (bloque le chargement des modules ES et du CSS).
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_api {
        server backend:8000;
    }

    # HTTP → redirection HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 10m;

        root /usr/share/nginx/html;
        index index.html;

        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # SPA React : toute route inconnue retombe sur index.html
        # (le routage se fait côté client, via l'état activeView de App.jsx).
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
